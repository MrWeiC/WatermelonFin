name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apple:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: WatermelonFin tvOS Tests
            runtime: tvOS
            device: Apple TV
          - scheme: WatermelonFin iOS
            runtime: iOS
            device: iPhone
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show toolchain
        run: xcodebuild -version
      - name: Install validation tools
        run: brew install swiftformat swiftlint swiftgen
      - name: Validate transport configuration
        run: swift Scripts/Checks/ValidateATSConfiguration.swift
      - name: Run platform-independent regression checks
        run: bash Scripts/Checks/run-reliability-checks.sh
      - name: Lint
        env:
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 Scripts/Checks/check-swiftlint-regressions.py "${LINT_BASE:-HEAD^}"
          swiftformat . --lint --config .swiftformat
      - name: Build and test ${{ matrix.runtime }}
        env:
          TEST_SCHEME: ${{ matrix.scheme }}
          TEST_RUNTIME: ${{ matrix.runtime }}
          TEST_DEVICE: ${{ matrix.device }}
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,os,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for k,vs in d.items() if os.environ["TEST_RUNTIME"] in k for v in vs if os.environ["TEST_DEVICE"] in v["name"]))')
          xcodebuild test -project WatermelonFin.xcodeproj -scheme "$TEST_SCHEME" \
            -destination "platform=$TEST_RUNTIME Simulator,id=$DEVICE_ID" \
            -resultBundlePath "TestResults/$TEST_RUNTIME.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime }}-test-results
          path: TestResults
